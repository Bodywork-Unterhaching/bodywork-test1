<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodywork Unterhaching | Sportmassage & Wellness</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --text-color: #2d3748;
      --primary: #2b6cb0;
      --accent: #319795;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1.5rem 2rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--primary);
    }

    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: var(--primary);
    }

    .massage-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .massage-card {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--bg-color);
    }

    .massage-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .massage-card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
    }

    .massage-card p {
      margin: 0;
      font-size: 0.9rem;
      color: #4a5568;
    }

    .week-toggle-btn {
      width: 100%;
      background: #edf2f7;
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .week-toggle-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .slot-group {
      display: none;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0;
    }

    .day-block {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
    }

    .day-title {
      font-weight: 600;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .time-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .time-badge {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }

    .time-badge:hover {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bodywork Unterhaching</h1>
  </header>

  <main>
    <section>
      <h2>Massage wählen</h2>
      <div class="massage-options">
        <div class="massage-card" onclick="selectMassage('Sportmassage, 60 Minuten')">
          <h3>Sportmassage</h3>
          <p>60 Minuten &bull; Intensiv</p>
        </div>
        <div class="massage-card" onclick="selectMassage('Wellnessmassage, 60 Minuten')">
          <h3>Wellnessmassage</h3>
          <p>60 Minuten &bull; Entspannung</p>
        </div>
      </div>
    </section>

    <section id="termine">
      <h2 id="calendar-title">Freie Termine (Sportmassage, 60 Minuten)</h2>
      <div id="dynamic-weeks-container">
        <div style="color: #666; font-size: 0.95rem;">Lade Termine...</div>
      </div>
    </section>
  </main>

  <script>
    const sheetId = '1PxFGtlsxI66o-jp3bW7sLaUkjck8dXdtb7C_xTrTGlw';
    const phone = '4915560764392';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&id=${sheetId}`;

    const days = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

    let currentSelectedMassage = 'Sportmassage, 60 Minuten';
    let rawCsvData = '';

    function formatShortDate(dateObj) {
      const d = String(dateObj.getDate()).padStart(2, '0');
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      return `${d}.${m}.`;
    }

    function getWeekRange(dateObj) {
      const d = new Date(dateObj);
      const day = d.getDay();
      const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
      
      const monday = new Date(d.setDate(diffToMonday));
      const saturday = new Date(monday);
      saturday.setDate(monday.getDate() + 5);

      return {
        key: `${monday.getFullYear()}-${monday.getMonth()+1}-${monday.getDate()}`,
        mondayObj: monday,
        saturdayObj: saturday,
        label: `Woche vom ${formatShortDate(monday)} bis ${formatShortDate(saturday)}`
      };
    }

    function selectMassage(massageName) {
      currentSelectedMassage = massageName;
      
      const titleEl = document.getElementById('calendar-title');
      if (titleEl) {
        titleEl.textContent = `Freie Termine (${massageName})`;
      }

      if (rawCsvData) {
        processAndRenderSlots(rawCsvData);
      }

      const termineSection = document.getElementById('termine');
      if (termineSection) {
        termineSection.scrollIntoView({ behavior: 'smooth' });
      }
    }

    async function loadSlots() {
      let container = document.getElementById('dynamic-weeks-container');
      if (!container) return;

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error('Netzwerkfehler');
        rawCsvData = await response.text();
        processAndRenderSlots(rawCsvData);
      } catch (err) {
        container.innerHTML = '<div style="color: #c53030; font-size: 0.95rem;">Fehler beim Laden der Termine. Bitte prüfe, ob die Google Sheet Datei öffentlich zugänglich ist.</div>';
      }
    }

    function processAndRenderSlots(csvText) {
      let container = document.getElementById('dynamic-weeks-container');
      if (!container) return;

      const rows = csvText.split(/\r?\n/);
      const weeksMap = new Map();

      rows.forEach((row, index) => {
        if (index === 0) return;
        if (!row.trim()) return;

        const cols = row.split(',').map(c => c.replace(/^"|"$/g, '').trim());
        if (cols.length >= 4) {
          const datumStr = cols[0];
          const start = cols[1];
          const ende = cols[2];
          const status = cols[3].toLowerCase();

          if (status === 'frei' || status.includes('frei')) {
            const parts = datumStr.split('.');
            if (parts.length === 3) {
              const day = parseInt(parts[0], 10);
              const month = parseInt(parts[1], 10);
              const year = parseInt(parts[2], 10);
              const dateObj = new Date(year, month - 1, day);

              if (isNaN(dateObj.getTime())) return;

              const weekInfo = getWeekRange(dateObj);

              if (!weeksMap.has(weekInfo.key)) {
                weeksMap.set(weekInfo.key, {
                  info: weekInfo,
                  daysMap: new Map()
                });
              }

              const weekEntry = weeksMap.get(weekInfo.key);
              const dayKey = datumStr;

              if (!weekEntry.daysMap.has(dayKey)) {
                const wochentag = days[dateObj.getDay()];
                weekEntry.daysMap.set(dayKey, {
                  wochentag,
                  datumKurz: `${String(day).padStart(2, '0')}.${String(month).padStart(2, '0')}.`,
                  datumFull: datumStr,
                  slots: []
                });
              }

              const waText = `Hallo Rüdiger, ich möchte gerne einen Termin für eine ${currentSelectedMassage} buchen:\nDatum: ${days[dateObj.getDay()]}, ${datumStr}\nUhrzeit: ${start} Uhr\nBitte sende mir eine kurze Bestätigung.`;
              const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(waText)}`;

              weekEntry.daysMap.get(dayKey).slots.push({
                start,
                ende,
                waUrl
              });
            }
          }
        }
      });

      container.innerHTML = '';

      if (weeksMap.size === 0) {
        container.innerHTML = '<div style="color: #666; font-size: 0.95rem;">Aktuell sind keine freien Termine verfügbar.</div>';
        return;
      }

      const sortedWeeks = Array.from(weeksMap.values()).sort((a, b) => a.info.mondayObj - b.info.mondayObj);

      sortedWeeks.forEach((week, index) => {
        const weekId = `week-group-${index}`;
        const isFirst = (index === 0);

        const btn = document.createElement('button');
        btn.className = isFirst ? 'week-toggle-btn active' : 'week-toggle-btn';
        btn.innerHTML = `<span>${week.info.label}</span>`;
        btn.onclick = () => toggleWeek(weekId, btn);

        const slotGroup = document.createElement('div');
        slotGroup.id = weekId;
        slotGroup.className = 'slot-group';
        if (isFirst) {
          slotGroup.style.display = 'flex';
        }

        const sortedDays = Array.from(week.daysMap.values());

        sortedDays.forEach(dayData => {
          const dayBlock = document.createElement('div');
          dayBlock.className = 'day-block';

          const dayTitle = document.createElement('div');
          dayTitle.className = 'day-title';
          dayTitle.textContent = `${dayData.wochentag}, ${dayData.datumKurz}`;
          dayBlock.appendChild(dayTitle);

          const timeGrid = document.createElement('div');
          timeGrid.className = 'time-grid';

          dayData.slots.forEach(slot => {
            const badge = document.createElement('a');
            badge.href = slot.waUrl;
            badge.target = '_blank';
            badge.className = 'time-badge';
            badge.textContent = `${slot.start} Uhr`;
            timeGrid.appendChild(badge);
          });

          dayBlock.appendChild(timeGrid);
          slotGroup.appendChild(dayBlock);
        });

        container.appendChild(btn);
        container.appendChild(slotGroup);
      });
    }

    function toggleWeek(id, btnElement) {
      const el = document.getElementById(id);
      if (!el) return;
      
      const isHidden = window.getComputedStyle(el).display === 'none';
      el.style.display = isHidden ? 'flex' : 'none';
      btnElement.classList.toggle('active', isHidden);
    }

    window.addEventListener('DOMContentLoaded', loadSlots);
  </script>
</body>
</html>
